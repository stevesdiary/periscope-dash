<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.otp-input');
            const verifyBtn = document.getElementById('verify-btn');

            inputs.forEach((input, index) => {
                // Focus handling
                input.addEventListener('input', (e) => {
                    const val = e.target.value;
                    
                    if (val.length > 1) {
                        e.target.value = val.slice(0, 1);
                    }

                    if (val !== '' && index < inputs.length - 1) {
                        inputs[index + 1].removeAttribute('disabled');
                        inputs[index + 1].focus();
                    }
                    
                    checkAllFilled();
                });

                // Backspace handling
                input.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace') {
                        if (input.value === '' && index > 0) {
                            inputs[index - 1].focus();
                            inputs[index - 1].value = '';
                        } else {
                            input.value = '';
                        }
                        
                        // Disable subsequent inputs if this one is cleared
                        for (let i = index + 1; i < inputs.length; i++) {
                            inputs[i].value = '';
                            inputs[i].setAttribute('disabled', 'true');
                        }
                        
                        checkAllFilled();
                    }
                });
                
                // Paste handling
                input.addEventListener('paste', (e) => {
                    e.preventDefault();
                    const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);
                    
                    if (pastedData) {
                        [...pastedData].forEach((char, i) => {
                            if (i < inputs.length) {
                                inputs[i].removeAttribute('disabled');
                                inputs[i].value = char;
                            }
                        });
                        
                        if (pastedData.length < inputs.length) {
                            inputs[pastedData.length].removeAttribute('disabled');
                            inputs[pastedData.length].focus();
                        } else {
                            inputs[inputs.length - 1].focus();
                        }
                        
                        checkAllFilled();
                    }
                });
            });

            function checkAllFilled() {
                const allFilled = Array.from(inputs).every(input => input.value !== '');
                if (allFilled) {
                    verifyBtn.classList.add('ring-2', 'ring-primary-container/50', 'ring-offset-2');
                } else {
                    verifyBtn.classList.remove('ring-2', 'ring-primary-container/50', 'ring-offset-2');
                }
            }

            // Mock verify action
            verifyBtn.addEventListener('click', () => {
                const allFilled = Array.from(inputs).every(input => input.value !== '');
                if (allFilled) {
                    verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px] animate-spin">progress_activity</span> Verifying...';
                    setTimeout(() => {
                        verifyBtn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Verified';
                        verifyBtn.classList.replace('bg-primary-container', 'bg-emerald-600');
                        verifyBtn.classList.replace('hover:bg-[#4338CA]', 'hover:bg-emerald-700');
                        // In a real app, redirection happens here
                    }, 1000);
                } else {
                    // Shake animation for error
                    inputs.forEach(input => {
                        if(input.value === '') {
                           input.classList.add('border-error');
                           setTimeout(() => input.classList.remove('border-error'), 1000);
                        }
                    });
                }
            });
            
            // Initial focus
            inputs[0].focus();
        });
    </script>
